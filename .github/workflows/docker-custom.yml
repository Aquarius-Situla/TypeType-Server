name: Build Custom Docker Image

on:
  push:
    branches:
      - custom
  workflow_dispatch:

concurrency:
  group: docker-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build metadata
        id: meta
        shell: bash
        run: |
          image_name="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA:0:7}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          version="$(grep -E '^appVersion=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '\r')"
          version="${version:-0.1.0}"
          {
            echo "image_name=$image_name"
            echo "short_sha=$short_sha"
            echo "build_time=$build_time"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.image_name }}:custom
            ghcr.io/${{ steps.meta.outputs.image_name }}:sha-${{ steps.meta.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}-custom
            GITHUB_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            GRADLE_MAX_WORKERS=4
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
